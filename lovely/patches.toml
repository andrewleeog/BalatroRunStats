[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Lovely preloads this module; vanilla loads it after the game's APIs are ready.
# When Steamodded is installed it loads manifest.json's main_file instead.
[[patches]]
[patches.module]
source = "BalatroRunStats.lua"
before = "main.lua"
name = "runstats.runtime"

# Start the attribution baseline after before-hand effects have set hand levels.
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "local modded = false"
position = "before"
match_indent = true
payload = "if RunStats then RunStats.scoring_base(text, hand_chips, mult) end"

# Blind/deck changes get their own residual rather than the last Joker's credit.
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "local nu_chip, nu_mult = G.GAME.selected_back:trigger_effect{context = 'final_scoring_step', chips = hand_chips, mult = mult}"
position = "before"
match_indent = true
payload = "if RunStats then RunStats.scoring_set_effect(nil); RunStats.scoring_repetition(nil) end"

# Vanilla effect loops; Steamodded uses the calculate_individual_effect hook.
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '(?m)^(?<indent>[\t ]*)for ii = 1, #effects do[\t ]*$'
position = "at"
line_prepend = '$indent'
payload = """
for ii = 1, #effects do
    if RunStats and not SMODS then RunStats.scoring_set_effect(effects[ii]) end
"""

# Remember the Joker that caused each vanilla playing-card repetition.
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '(?m)^(?<indent>[\t ]*)(?<statement>if reps\[j\] ~= 1 then[^\r\n]*)$'
position = "at"
line_prepend = '$indent'
payload = """
if RunStats and not SMODS then RunStats.scoring_repetition(reps[j]) end
$statement
"""

# A Joker's Polychrome edition applies after other-Joker effects in vanilla.
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '(?m)^(?<indent>[\t ]*)(?<statement>if edition_effects\.jokers\.[a-z_]+ then)[\t ]*$'
position = "at"
line_prepend = '$indent'
payload = """
if RunStats and not SMODS then RunStats.scoring_set_effect(edition_effects.jokers, _card) end
$statement
"""

# Begin before stock is generated/restored; capture again after tags modify it.
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if G.load_shop_jokers then"
position = "before"
match_indent = true
payload = "if RunStats then RunStats.begin_shop_stock(false) end"

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if not nosave_shop then G.E_MANAGER:add_event(Event({ func = function() save_run(); return true end})) end"
position = "before"
match_indent = true
payload = "if RunStats then RunStats.capture_shop_stock() end"

# This runs for paid and free rerolls, before old stock is removed.
[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "calculate_reroll_cost(final_free)"
position = "before"
match_indent = true
payload = "if RunStats then RunStats.capture_shop_stock(); RunStats.begin_shop_stock(true) end"

# Successful voucher redemption, after the charge (also handles free vouchers).
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "set_voucher_usage(self)"
position = "after"
match_indent = true
payload = "if RunStats then RunStats.record_shop_voucher(self, true) end"

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "boot_timer('prep stage', 'splash prep',1)"
position = "before"
match_indent = true
payload = "if not SMODS then require('runstats.runtime') end"

# Add the PowerBalatro button definition to the pause (options) menu
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "local high_scores = UIBox_button{ label = {localize('b_stats')}, button = \"high_scores\", minw = 5}"
position = "after"
match_indent = true
payload = "local run_stats_button = G.STAGE == G.STAGES.RUN and UIBox_button{ label = {\"PowerBalatro\"}, button = \"runstats_open\", minw = 5} or nil"

# Insert it into the options menu contents after the vanilla Stats button
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "high_scores,"
position = "after"
match_indent = true
payload = "run_stats_button,"

# Categorize actual purchases, inside their successful charge paths.
[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "inc_career_stat('c_shop_dollars_spent', c1.cost)"
position = "after"
match_indent = true
payload = "if RunStats then RunStats.record_spend(RunStats.purchase_category(c1), c1.cost) end"

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "inc_career_stat('c_shop_dollars_spent', G.GAME.current_round.reroll_cost)"
position = "after"
match_indent = true
payload = "if RunStats then RunStats.record_spend('rerolls', G.GAME.current_round.reroll_cost) end"

# Matches both the booster charge and the voucher charge.
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "inc_career_stat('c_shop_dollars_spent', self.cost)"
position = "after"
match_indent = true
times = 2
payload = "if RunStats then RunStats.record_spend(RunStats.purchase_category(self), self.cost) end"

# Identify the actual aggregate payout before ease_dollars receives it.
[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "ease_dollars(G.GAME.current_round.dollars)"
position = "before"
match_indent = true
payload = "if RunStats then RunStats.prepare_cashout_income() end"

# Sales count only when the sale proceeds are actually paid.
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "ease_dollars(self.sell_cost)"
position = "before"
match_indent = true
payload = "if RunStats then RunStats.prepare_income('sales', self) end"

# Run at the actual payment sites, including deferred card/joker callbacks.
[[patches]]
[patches.regex]
target = "card.lua"
pattern = '(?m)^(?<indent>[\t ]*)ease_dollars\((?<args>[^\r\n]+)\)[\t ]*$'
position = "at"
line_prepend = '$indent'
payload = "if RunStats then RunStats.with_card_income(self, function() ease_dollars($args) end) else ease_dollars($args) end"

# Vanilla pays returned effects here. Steamodded replaces these sites and uses
# the calculate_individual_effect hook instead (zero regex matches is expected).
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '(?m)^(?<indent>[\t ]*)ease_dollars\((?<args>effects\[ii\]\.(?<key>[a-z_]+))\)[\t ]*$'
position = "at"
line_prepend = '$indent'
payload = "if RunStats then RunStats.with_payment_income(effects[ii], nil, '$key', function() ease_dollars($args) end) else ease_dollars($args) end"

# Vanilla: one applied scoring pass, after individual Joker effects are gathered.
# Steamodded replaces these loops and uses the scoped trigger_effects hook.
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '(?m)^(?<indent>[\t ]*)scoring_hand\[i\]\.lucky_trigger = nil[\t ]*$'
position = "at"
line_prepend = '$indent'
payload = """
if RunStats then RunStats.record_vanilla_trigger(scoring_hand[i], 'scoring', effects) end
scoring_hand[i].lucky_trigger = nil
"""

# Both held-card loops: during scoring and at end of round, including repetitions.
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '(?m)^(?<indent>[\t ]*)if reps\[j\] == 1 then[\t ]*$'
position = "at"
line_prepend = '$indent'
payload = """
if RunStats then RunStats.record_vanilla_trigger(G.hand.cards[i], 'held', effects) end
if reps[j] == 1 then
"""
