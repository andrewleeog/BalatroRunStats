[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Add the Run Stats button definition to the pause (options) menu
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "local high_scores = UIBox_button{ label = {localize('b_stats')}, button = \"high_scores\", minw = 5}"
position = "after"
match_indent = true
payload = "local run_stats_button = G.STAGE == G.STAGES.RUN and UIBox_button{ label = {\"Run Stats\"}, button = \"runstats_open\", minw = 5} or nil"

# Insert it into the options menu contents after the vanilla Stats button
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "high_scores,"
position = "after"
match_indent = true
payload = "run_stats_button,"

# Categorize actual purchases, inside their successful charge paths.
[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "inc_career_stat('c_shop_dollars_spent', c1.cost)"
position = "after"
match_indent = true
payload = "if RunStats then RunStats.record_spend(RunStats.purchase_category(c1), c1.cost) end"

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "inc_career_stat('c_shop_dollars_spent', G.GAME.current_round.reroll_cost)"
position = "after"
match_indent = true
payload = "if RunStats then RunStats.record_spend('rerolls', G.GAME.current_round.reroll_cost) end"

# Matches both the booster charge and the voucher charge.
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "inc_career_stat('c_shop_dollars_spent', self.cost)"
position = "after"
match_indent = true
times = 2
payload = "if RunStats then RunStats.record_spend(RunStats.purchase_category(self), self.cost) end"
